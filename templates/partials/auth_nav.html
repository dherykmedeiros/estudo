<header class="fixed top-0 inset-x-0 z-40 md:hidden border-b border-zinc-800/80 bg-zinc-950/95 backdrop-blur-xl">
    <div class="px-4 py-3 flex items-center justify-between">
        <div>
            <p class="text-[11px] uppercase tracking-wider text-zinc-500">JRD Labs</p>
            <span class="font-semibold text-zinc-100">FinTrack</span>
        </div>
        <button type="button" @click="sidebarOpen = true" class="px-3 py-2 rounded-lg border border-zinc-700 text-sm hover:border-zinc-500 hover:bg-zinc-900/60 transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950">Menu</button>
    </div>
</header>

<aside class="hidden md:flex fixed top-0 left-0 z-40 h-screen w-72 border-r border-zinc-800/80 bg-zinc-950/95 backdrop-blur-xl">
    <div class="w-full p-4 flex flex-col">
        <div class="mb-6 px-2 pb-4 border-b border-zinc-800">
            <p class="text-[11px] uppercase tracking-[0.2em] text-zinc-500">JRD Labs</p>
            <h2 class="text-2xl font-black tracking-tight">FinTrack</h2>
            <p class="text-xs text-zinc-400 mt-1">Painel financeiro premium</p>
        </div>
        <nav class="flex-1 space-y-2 text-sm">
            <a href="{% url 'dashboard:home' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if request.resolver_match.url_name == 'home' %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M3 10.5 12 3l9 7.5v9A1.5 1.5 0 0 1 19.5 21h-15A1.5 1.5 0 0 1 3 19.5v-9Z"/></svg><span>Dashboard</span>
            </a>
            <a href="{% url 'finances:transaction_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'transactions' in request.path and 'import' not in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M4.5 4.5h15A1.5 1.5 0 0 1 21 6v12a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18V6a1.5 1.5 0 0 1 1.5-1.5Zm1.5 4.5h12V7.5H6V9Zm0 3h7.5v-1.5H6V12Zm0 3h12v-1.5H6V15Z"/></svg><span>Transacoes</span>
            </a>
            <a href="{% url 'finances:transaction_import' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'transactions/import' in request.path %}border-emerald-500/70 bg-emerald-500/10 text-emerald-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42L11 12.59V4a1 1 0 0 1 1-1Z"/><path d="M4 16a1 1 0 0 1 1 1v2h14v-2a1 1 0 1 1 2 0v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a1 1 0 0 1 1-1Z"/></svg><span>Importar</span>
            </a>
            <a href="{% url 'finances:category_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'categories' in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h6A1.5 1.5 0 0 1 12 7.5v3A1.5 1.5 0 0 1 10.5 12h-6A1.5 1.5 0 0 1 3 10.5v-3Zm9 6A1.5 1.5 0 0 1 13.5 12h6A1.5 1.5 0 0 1 21 13.5v3a1.5 1.5 0 0 1-1.5 1.5h-6a1.5 1.5 0 0 1-1.5-1.5v-3Zm0-6A1.5 1.5 0 0 1 13.5 6h6A1.5 1.5 0 0 1 21 7.5v1.5a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 12 9V7.5ZM3 15A1.5 1.5 0 0 1 4.5 13h6a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 3 16v-1Z"/></svg><span>Categorias</span>
            </a>
            <a href="{% url 'finances:goal_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'goals' in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M11 2a1 1 0 0 1 2 0v1.06A9 9 0 1 1 3.06 13H2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-.94A7 7 0 1 0 13 5.1V6a1 1 0 1 1-2 0V2Z"/></svg><span>Metas</span>
            </a>
            <a href="{% url 'finances:account_checking_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'accounts/contas-correntes' in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 2c5.523 0 10 1.79 10 4s-4.477 4-10 4S2 8.21 2 6s4.477-4 10-4Zm0 9c5.523 0 10 1.79 10 4s-4.477 4-10 4-10-1.79-10-4 4.477-4 10-4Zm0 9c5.523 0 10 1.79 10 4s-4.477 4-10 4-10-1.79-10-4 4.477-4 10-4Z"/></svg><span>Contas</span>
            </a>
            <a href="{% url 'finances:account_credit_card_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'accounts/cartoes' in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2H3V6Zm0 4h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8Zm3 4a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2H6Z"/></svg><span>Cartoes</span>
            </a>
            <a href="{% url 'accounts:profile' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 {% if 'accounts/profile' in request.path %}border-violet-500/70 bg-violet-500/10 text-violet-200{% else %}border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 text-zinc-200{% endif %}">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg><span>Perfil</span>
            </a>
        </nav>
        <form method="post" action="{% url 'accounts:logout' %}" class="pt-4 border-t border-zinc-800">
            {% csrf_token %}
            <button type="submit" class="w-full px-3 py-2.5 rounded-xl bg-rose-600/90 hover:bg-rose-500 transition text-sm font-semibold focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950">Sair</button>
        </form>
    </div>
</aside>

            <a @click="sidebarOpen = false" href="{% url 'finances:goal_list' %}" class="flex items-center gap-2 px-3 py-2.5 rounded-xl border border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 transition focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M11 2a1 1 0 0 1 2 0v1.06A9 9 0 1 1 3.06 13H2a1 1 0 1 1 0-2h2a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-.94A7 7 0 1 0 13 5.1V6a1 1 0 1 1-2 0V2Z"/></svg>Metas</a>

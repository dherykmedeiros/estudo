<h3 class="text-base sm:text-lg font-semibold mb-3 sm:mb-4">Composicao de investimentos</h3>
<div id="{{ chart_id }}" class="h-64 sm:h-80"></div>
{{ chart_data|json_script:"chart-data-investimentos" }}
<script>
(function () {
    const data = JSON.parse(document.getElementById('chart-data-investimentos').textContent);
    const options = {
        chart: { type: 'donut', background: 'transparent' },
        theme: { mode: 'dark' },
        series: data.series,
        labels: data.labels,
        stroke: { show: false },
        legend: { position: 'bottom' }
    };
    new ApexCharts(document.querySelector('#{{ chart_id }}'), options).render();
})();
</script>
